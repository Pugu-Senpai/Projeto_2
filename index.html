<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Grande Corrida '60</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/main.js"></script>
    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kaushan+Script&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ECRÃ INICIAL -->
    <section id="ecra-inicial" class="ecra">
        <div class="fundo-jogo">
            <h1 class="visualmente-oculto">Jogo: Moto Grande Corrida '60</h1>
            <img class="barra-titulo" src="./assets/img/titulo_jogo.png" alt="">
            <nav class="inicial-nav-conteudo" aria-label="Menu Iniciar">
                <button id="btn-iniciar-jogo" type="button" class="inicial-botao">
                    Iniciar Jogo
                </button>
                <button data-janela="classificacao" type="button" class="inicial-botao">
                    Classificação
                </button>
                <button data-janela="regras" type="button" class="inicial-botao">
                    Regras
                </button>
                <button data-janela="opcoes" type="button" class="inicial-botao">
                    Opções
                </button>
            </nav>
        </div>
    </section>

    <!-- ECRÃ CONFIGURAÇÕES -->
    <section id="ecra-configuracao" class="ecra" hidden>
        <h2>TESTE ECRÃ CONFIGURAÇÃO</h2>
    </section>

    <!-- ECRÃ JOGO -->
    <div id="ecra-jogo" class="ecra" hidden>

    </div>

    <dialog id="classificacao">
        <h2>TBD - CLASSIFICAÇÃO</h2>
        <form method="dialog">
            <button type="submit" class="btn-fechar">Fechar</button>
        </form>    
    </dialog>
    <dialog id="regras">
        <h2>TBD - REGRAS</h2>
        <form method="dialog">
            <button type="submit" class="btn-fechar">Fechar</button>
        </form>   
    </dialog>
    <dialog id="opcoes">
        <h2>TBD - OPÇÕES</h2>
        <form method="dialog">
            <button type="submit" class="btn-fechar">Fechar</button>
        </form>
    </dialog>
</body>
</html>
