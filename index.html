<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Grande Corrida '60</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/main.js"></script>
    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kaushan+Script&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ECRÃ INICIAL -->
    <section id="ecra-inicial" class="ecra">
        <div class="fundo-jogo">
            <h1 class="visualmente-oculto">Jogo: Moto Grande Corrida '60</h1>
            <img class="barra-titulo" src="./assets/img/titulo_jogo.png" alt="">
            <nav class="inicial-nav-conteudo" aria-label="Menu Iniciar">
                <button id="btn-iniciar-jogo" type="button" class="inicial-botao">
                    Iniciar Jogo
                </button>
                <button data-janela="classificacao" type="button" class="inicial-botao">
                    Classificação
                </button>
                <button data-janela="regras" type="button" class="inicial-botao">
                    Regras
                </button>
                <button data-janela="opcoes" type="button" class="inicial-botao">
                    Opções
                </button>
            </nav>
        </div>
    </section>

    <!-- ECRÃ CONFIGURAÇÕES -->
    <section id="ecra-configuracao" class="ecra" hidden>
        <h2>Configuração do Jogo</h2>
        <form id="dados-jogador" novalidate>
            <fieldset>
                <legend>Escolha o número de jogadores</legend>

                <input type="radio" id="num-2" name="num-jogadores" value="2" checked>
                <label for="num-2">2</label>
                <input type="radio" id="num-3" name="num-jogadores" value="3">
                <label for="num-3">3</label>
                <input type="radio" id="num-4" name="num-jogadores" value="4">
                <label for="num-4">4</label>
                <input type="radio" id="num-5" name="num-jogadores" value="5">
                <label for="num-5">5</label>
                <input type="radio" id="num-6" name="num-jogadores" value="6">
                <label for="num-6">6</label>
            </fieldset>
            <div id="lista-jogadores">

            </div>
            <p id="erro-formulario" role="alert">

            </p>
            <button type="submit">Começar Corrida</button>
            <button id="btn-voltar" type="button">Voltar</button>
        </form>
    </section>

    <!-- ECRÃ JOGO -->
    <div id="ecra-jogo" class="ecra" hidden>
        <header>
            <h2>Moto Grande Corrida '60</h2>
            <div id="vez-jogador">

            </div>
            <div id="volta">

            </div>
        </header>
        <main >
            <section id="pista">

            </section>
        </main>
        <aside aria-label="Classificação da Corrida">
            <section aria-label="Dado">
                <div id="numero-dado">
                    
                </div>
                <button id="btn-dado" type="button">
                    Lançar dado
                </button>
            </section>
            <h2>Posições</h2>
            <ol id="lista-posicoes">

            </ol>
        </aside>
    </div>

    <dialog id="classificacao">
        <h2>CLASSIFICAÇÃO</h2>
        <ol id="lista-classificacao">
            
        </ol>
        <form method="dialog">
            <button type="submit" class="btn-fechar">Fechar</button>
        </form>    
    </dialog>
    <dialog id="regras">
        <h2>TBD - REGRAS</h2>
        <form method="dialog">
            <button type="submit" class="btn-fechar">Fechar</button>
        </form>   
    </dialog>
    <dialog id="opcoes">
        <h2>TBD - OPÇÕES</h2>
        <form method="dialog">
            <button type="submit" class="btn-fechar">Fechar</button>
        </form>
    </dialog>
    <dialog id="vitoria">
        <h2>VENCEDOR</h2>
        <p id="texto-vitoria"></p>
        <form method="dialog">
            <button type="submit" class="btn-fechar">Voltar ao Menu</button>
        </form>
    </dialog>
</body>
</html>
